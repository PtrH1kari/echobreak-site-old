<h1>EchoBreak</h1>
<h2>Вход</h2>

<form id="loginForm">
    <label class="left-label" for="name">Имя пользователя</label>
    <input id="name" type="text" autocomplete="username" required>

    <label class="left-label" for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <p id="msg"></p>

    <button type="submit" class="button">Войти</button>
</form>

<p style="margin-top:15px;">
    Нет аккаунта?
    <a href="/register" data-page="register"><span>Регистрация</span></a>
</p>
